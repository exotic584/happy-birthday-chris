<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday คริส 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Itim&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<section id="s1" class="scene active">
  <p class="big">วันนี้เป็นวันพิเศษของคริส 💗</p>
  <p class="sub">หลับตาอธิษฐานขอพรดี ๆ ให้ตัวเองนะ</p>
  <div id="count" class="count" aria-live="polite">10</div>
  <p class="hint">ตั้งจิตอธิษฐานไว้ในใจ... ✨</p>
</section>

<section id="s2" class="scene">
  <div class="cake">
    <div class="flame-wrap"><div class="glow"></div><div class="flame"></div><div class="smoke"><i></i><i></i><i></i></div></div>
    <div class="candle"></div>
    <div class="tier t1"><span class="drip"></span></div>
    <div class="tier t2"></div>
    <div class="plate"></div>
  </div>
  <p class="big">อธิษฐานเสร็จหรือยังเอ่ย? 🎂</p>
  <p class="sub" id="ready">พร้อมแล้วก็เป่าเทียนกันเลย!</p>
  <button id="blow" class="btn" hidden>เป่าเทียนเลย 🎂</button>
</section>

<section id="s3" class="scene">
  <svg class="cat" viewBox="0 0 220 240" role="img" aria-label="แมวการ์ตูนถือซองจดหมาย">
    <g class="tail"><path d="M165 200c40-5 45-50 20-60" fill="none" stroke="#ff9ec7" stroke-width="14" stroke-linecap="round"/></g>
    <ellipse cx="110" cy="190" rx="58" ry="46" fill="#ffd6e8"/>
    <polygon points="52,70 58,18 92,48" fill="#ffd6e8"/><polygon points="168,70 162,18 128,48" fill="#ffd6e8"/>
    <polygon points="62,60 62,34 80,50" fill="#ff7eb6"/><polygon points="158,60 158,34 140,50" fill="#ff7eb6"/>
    <ellipse cx="110" cy="100" rx="64" ry="55" fill="#ffe6f1"/>
    <g class="eyes"><ellipse cx="85" cy="98" rx="9" ry="12" fill="#1a0a14"/><ellipse cx="135" cy="98" rx="9" ry="12" fill="#1a0a14"/>
    <circle cx="88" cy="93" r="3.5" fill="#fff"/><circle cx="138" cy="93" r="3.5" fill="#fff"/></g>
    <ellipse cx="66" cy="115" rx="12" ry="7" fill="#ff7eb6" opacity=".6"/><ellipse cx="154" cy="115" rx="12" ry="7" fill="#ff7eb6" opacity=".6"/>
    <path d="M104 112l6 6 6-6z" fill="#ff4d94"/><path d="M110 118v6M98 126q12 8 24 0" fill="none" stroke="#1a0a14" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 105h-22M40 115l-20 8M180 105h22M180 115l20 8" stroke="#1a0a14" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="78" cy="205" rx="16" ry="12" fill="#ffe6f1"/><ellipse cx="142" cy="205" rx="16" ry="12" fill="#ffe6f1"/>
  </svg>
  <button id="envelope" class="envelope" aria-label="เปิดจดหมาย">
    <span class="e-back"></span><span class="e-front"></span><span class="e-flap"></span><span class="e-heart">💗</span>
  </button>
  <p class="big pop">สุขสันต์วันเกิดนะคริส! 🐱💗</p>
  <p class="sub">มีจดหมายมาถึงคริสด้วยนะ... ลองกดดูสิ 💌</p>
</section>

<section id="s4" class="scene">
  <article class="paper">
    <p id="letter" class="letter" aria-live="polite"></p>
    <p id="sign" class="sign">จากคนที่รักคริสที่สุด 💗</p>
  </article>
</section>

<script src="script.js"></script>
</body>
</html>
